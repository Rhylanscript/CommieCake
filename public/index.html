<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>CommieCake | Sorting Visualiser</title>
        <link rel="icon" href="assets/icons/commiecake.ico" />
        <link rel="stylesheet" href="css/base.css">
        <link rel="stylesheet" href="css/sidebar.css">
        <link rel="stylesheet" href="css/canvas.css">
        <link rel="stylesheet" href="css/command-palette.css">
        <link rel="stylesheet" href="css/code-panel.css">
        <link rel="stylesheet" href="css/icon-btn.css">
        <link rel="stylesheet" href="css/important.css">
    </head>
    <body>
        <div id="app">
            <aside id="controls">
                <div class="panel-header">
                    <h1>CommieCake</h1>
                    <p class="tagline">Data for all</p>
                </div>

                <div class="control-group">
                    <label id="algo-picker-label" for="algo-picker-toggle">Algorithm</label>
                    <button
                        type="button"
                        id="algo-picker-toggle"
                        class="algo-picker-toggle"
                        aria-haspopup="dialog"
                        aria-expanded="false"
                    >
                        <span id="algo-picker-current"></span>
                        <span class="algo-picker-hint">Select</span>
                    </button>

                    <div class="description-row" id="description-row">
                        <p id="algorithm-description" class="algorithm-description"></p>
                        <button 
                            id="info-btn" 
                            class="info-btn" 
                            type="button"
                            aria-label="Show Full Description"
                            aria-expanded="false"
                            aria-controls="description-popup"
                        >i</button>
                        <div id="description-popup" class="description-popup" role="tooltip"></div>
                    </div>

                    <div class="control-group hidden" id="algo-b-control-group">
                        <label id="algo-picker-label-b" for="algo-picker-toggle-b">Algorithm B</label>
                        <button
                            type="button"
                            id="algo-picker-toggle-b"
                            class="algo-picker-toggle"
                            aria-haspopup="dialog"
                            aria-expanded="false"
                        >
                            <span id="algo-picker-current-b"></span>
                            <span class="algo-picker-hint">Select</span>
                        </button>
                    </div>
                </div>

                <div class="control-group">
                    <button type="button" id="race-toggle-btn" class="race-toggle-btn">Race Mode: Off</button>
                </div>

                <div class="control-group">
                    <label for="size-slider">Array size</label>
                    <div class="range-row">
                        <input type="range" id="size-slider" min="5" max="1000" value="250" />
                        <input type="number" id="size-number" min="5" max="1000" value="250" />
                    </div>
                </div>

                <div class="control-group">
                    <label for="speed-slider">Speed</label>
                    <div class="range-row">
                        <input type="range" id="speed-slider" min="1" max="500" value="400" />
                        <input type="number" id="speed-number" min="1" max="500" value="400" />
                    </div>
                </div>

                <div class="button-row">
                    <button id="new-array-btn">New Array</button>
                    <button id="play-pause-btn" class="primary">Start</button>
                    <button id="step-btn">Step</button>
                    <button id="benchmark-btn">Benchmark</button>
                    <button id="code-btn">Show Code</button>
                </div>
            </aside>

            <main>
                <button type="button" id="sound-btn" class="icon-btn" aria-pressed="false" aria-label="Toggle Sound">
                    <img id="sound-icon" src="assets/images/sound-off.svg" alt="" width="24" height="24" />
                </button>

                <p id="race-banner" class="race-banner"></p>

                <div id="race-tracks" class="race-tracks">
                    <div class="track-row" id="track-row-a">
                        <div class="track-stats">
                            <div class="stat">
                                <span class="stat-label">Time</span>
                                <span id="timer-value" class="stat-value stat-value-timer">0.00s</span>
                            </div>
                            <div class="stat">
                                <span class="stat-label">Complexity</span>
                                <span id="complexity-value" class="stat-value stat-value-complexity">-</span>
                            </div>
                            <div class="stat">
                                <span class="stat-label">Comparisons</span>
                                <span id="comparisons-value" class="stat-value stat-value-comparisons">0</span>
                            </div>
                            <div class="stat">
                                <span class="stat-label">Swaps</span>
                                <span id="swaps-value" class="stat-value stat-value-swaps">0</span>
                            </div>
                        </div>

                        <div id="canvas-wrapper" class="canvas-wrapper">
                            <div class="canvas-frame">
                                <span id="canvas-label-a" class="canvas-label"></span>
                                <span id="winner-badge-a" class="winner-badge">Winner!</span>
                                <canvas id="canvas" width="900" height="500"></canvas>
                            </div>
                            <pre id="code-panel" class="hidden"><code id="code-content"></code></pre>
                        </div>
                    </div>

                    <div class="track-row hidden" id="track-row-b">
                        <div class="track-stats">
                            <div class="stat">
                                <span class="stat-label">Time</span>
                                <span id="timer-value-b" class="stat-value stat-value-timer">0.00s</span>
                            </div>
                            <div class="stat">
                                <span class="stat-label">Complexity</span>
                                <span id="complexity-value-b" class="stat-value stat-value-complexity">-</span>
                            </div>
                            <div class="stat">
                                <span class="stat-label">Comparisons</span>
                                <span id="comparisons-value-b" class="stat-value stat-value-comparisons">0</span>
                            </div>
                            <div class="stat">
                                <span class="stat-label">Swaps</span>
                                <span id="swaps-value-b" class="stat-value stat-value-swaps">0</span>
                            </div>
                        </div>

                        <div id="canvas-wrapper-b" class="canvas-wrapper">
                            <div class="canvas-frame">
                                <span id="canvas-label-b" class="canvas-label"></span>
                                <span id="winner-badge-b" class="winner-badge">Winner!</span>
                                <canvas id="canvas-b" width="900" height="500"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>

        <div id="command-palette-backdrop" class="command-palette-backdrop hidden">
            <div class="command-palette" role="dialog" aria-modal="true" aria-label="Choose Algorithm">
                <input
                    type="text"
                    id="command-palette-search"
                    class="command-palette-search"
                    placeholder="Search Algorithms..."
                    autocomplete="off"
                />
                <div class="command-palette-toolbar">
                    <select id="category-filter-select" class="palette-select" aria-label="Filter by Category"></select>
                    <select id="sort-select" class="palette-select" aria-label="Sort Order">
                        <option value="category">Grouped</option>
                        <option value="name-asc">A-Z</option>
                        <option value="name-dsc">Z-A</option>
                    </select>
                </div>
                <div id="command-palette-list" class="command-palette-list" role="listbox" aria-label="Algorithm"></div>
            </div>
        </div>

        <script type="module" src="js/main.js"></script>
    </body>
</html>
