<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>CommieCake | Sorting Visualiser</title>
        <link rel="stylesheet" href="css/style.css" />
        <link rel="stylesheet" href="css/important.css" />
        <link rel="icon" href="assets/icons/commiecake.ico" />
    </head>
    <body>
        <div id="app">
            <aside id="controls">
                <div class="panel-header">
                    <h1>CommieCake</h1>
                    <p class="tagline">Data for all</p>
                </div>

                <div class="control-group">
                    <label id="algo-picker-label" for="algo-picker-toggle">Algorithm</label>
                    <button
                        type="button"
                        id="algo-picker-toggle"
                        class="algo-picker-toggle"
                        aria-haspopup="dialog"
                        aria-expanded="false"
                    >
                        <span id="algo-picker-current"></span>
                        <span class="algo-picker-hint">Select</span>
                    </button>

                    <div class="description-row">
                        <p id="algorithm-description" class="algorithm-description"></p>
                        <button 
                            id="info-btn" 
                            class="info-btn" 
                            type="button"
                            aria-label="Show Full Description"
                            aria-expanded="false"
                            aria-controls="description-popup"
                        >i</button>
                        <div id="description-popup" class="description-popup" role="tooltip"></div>
                    </div>
                </div>

                <div class="control-group">
                    <label for="size-slider">Array size</label>
                    <div class="range-row">
                        <input type="range" id="size-slider" min="5" max="1000" value="250" />
                        <input type="number" id="size-number" min="5" max="1000" value="250" />
                    </div>
                </div>

                <div class="control-group">
                    <label for="speed-slider">Speed</label>
                    <div class="range-row">
                        <input type="range" id="speed-slider" min="1" max="500" value="400" />
                        <input type="number" id="speed-number" min="1" max="500" value="400" />
                    </div>
                </div>

                <div class="button-row">
                    <button id="new-array-btn">New Array</button>
                    <button id="play-pause-btn" class="primary">Start</button>
                    <button id="step-btn">Step</button>
                    <button id="benchmark-btn">Benchmark</button>
                    <button id="code-btn">Show Code</button>
                </div>

                <p class="shortcuts-hint">space: play/pause ➞: step</p>
            </aside>

            <main>
                <div id="stats-bar">
                    <div class="stat">
                        <span class="stat-label">Time</span>
                        <span id="timer-value" class="stat-value stat-value-timer">0.00s</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Complexity</span>
                        <span id="complexity-value" class="stat-value stat-value-complexity">-</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Comparisons</span>
                        <span id="comparisons-value" class="stat-value stat-value-comparisons">0</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Swaps</span>
                        <span id="swaps-value" class="stat-value stat-value-swaps">0</span>
                    </div>
                    <button 
                        type="button"
                        id="sound-btn"
                        class="icon-btn"
                        aria-pressed="false"
                        aria-label="Toggle Sound"
                    ><img id="sound-icon" src="assets/images/sound-off.svg" alt="" width="24" height="24" /></button>
                </div>
                <div id="canvas-wrapper">
                    <canvas id="canvas" width="900" height="500"></canvas>
                    <pre id="code-panel" class="hidden"><code id="code-content"></code></pre>
                </div>
            </main>
        </div>

        <div id="command-palette-backdrop" class="command-palette-backdrop hidden">
            <div class="command-palette" role="dialog" aria-modal="true" aria-label="Choose Algorithm">
                <input
                    type="text"
                    id="command-palette-search"
                    class="command-palette-search"
                    placeholder="Search Algorithms..."
                    autocomplete="off"
                />
                <div class="command-palette-toolbar">
                    <select id="category-filter-select" class="palette-select" aria-label="Filter by Category"></select>
                    <select id="sort-select" class="palette-select" aria-label="Sort Order">
                        <option value="category">Grouped</option>
                        <option value="name-asc">A-Z</option>
                        <option value="name-dsc">Z-A</option>
                    </select>
                </div>
                <div id="command-palette-list" class="command-palette-list" role="listbox" aria-label="Algorithm"></div>
            </div>
        </div>

        <script type="module" src="js/main.js"></script>
    </body>
</html>
